name: Pages

# Publica la demostración jugable en GitHub Pages. No lleva ningún dato real: el mundo se
# inventa en cada despliegue con el mismo guion que `npm run demo`, y se lee con el pipeline
# de verdad del servidor, así que lo que se publica pasa por el mismo parser que lo tuyo.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez, y sin cancelar el que esté a medias.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Construir la demostración
        # La base es el nombre del repositorio, que es el subdirectorio donde sirve Pages.
        run: npm run build:pages -- --base "/${{ github.event.repository.name }}/"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
